# Streamlit config — LILO Dashboard
# Trava a porta em 8100 (8501 default e 8506 anterior estao em uso por outras APIs)

[server]
port = 8100
headless = true
runOnSave = false
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
# Paleta estilo Claude Desktop: marfim quente + acento coral
primaryColor = "#D97757"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#3D3929"
font = "sans serif"
