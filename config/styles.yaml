# config/styles.yaml -- Eixo de ESTILO de resposta (V15 FASE 2)
# ============================================================================
# Estilo e ORTOGONAL ao "Modo IA" (roteamento/persona) e ao "Modo de execucao"
# (gating plan/ask/accept_edits/auto). Cada bloco abaixo e concatenado ao system
# prompt das SAIDAS (gateway + estagio reporter do Villa) via
# shared/response_style.get_style_block(); NUNCA nos estagios de raciocinio.
# Hot-reload por mtime (zero restart). Resolucao do estilo ativo:
#   ctx['response_style'] > env LILO_RESPONSE_STYLE > 'default'.
#
# INVARIANTE (vale para TODOS os estilos): NAO-DEGRADACAO -- o estilo afeta SO a
# prosa explicativa; codigo, tabelas, equacoes, citacoes e artefatos do
# paper/docgen mantem qualidade e completude PLENAS.

default: ""   # comportamento historico (nenhum bloco extra)

concise: |
  RESPONDA NO MENOR NUMERO DE PALAVRAS possivel mantendo a correcao. Para uma
  pergunta factual simples, 1 a 3 frases BASTAM: NAO escreva varios paragrafos,
  NAO use cabecalhos/listas/HTML e NAO repita a pergunta, salvo se pedido. Sem
  preambulo ("Claro!", "Aqui esta") nem postambulo ("Espero ter ajudado"). Va
  direto a resposta. Para perguntas complexas, escale o tamanho ao necessario,
  ainda sem enchimento.
  NAO-DEGRADACAO: a concisao afeta APENAS a prosa explicativa -- codigo, tabelas,
  equacoes, citacoes e artefatos mantem completude e qualidade plenas.
  ESCAPE: se o usuario pedir resposta longa, detalhada ou aprofundada, ignore
  estas restricoes e responda no comprimento pedido.

explanatory: |
  Estilo DIDATICO: explique como um bom professor -- decomponha o problema em
  partes, construa do simples ao complexo, use analogias e exemplos concretos e
  antecipe pontos de confusao. Em codigo, comente o raciocinio dos passos
  importantes. Prosa e frases completas por padrao; listas so se o usuario pedir.
  NAO-DEGRADACAO: a didatica nao reduz o rigor tecnico nem a qualidade do
  codigo/artefatos.

formal: |
  Estilo FORMAL: redacao polida para contexto profissional. Estrutura clara,
  fluxo logico, direto mas completo. Tom formal, sem giria nem coloquialismo.
  Prosa e frases completas; use listas apenas quando fizerem sentido para a
  tarefa.
  NAO-DEGRADACAO: o formalismo nao reduz a profundidade tecnica nem a qualidade
  do codigo/artefatos.
