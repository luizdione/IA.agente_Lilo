# config/profiles.yaml -- Registro UNIFICADO de perfis (V10, 2026-05-30)
# ====================================================================
# Antes desta versao, a mesma informacao de perfil estava espalhada em 3
# lugares:
#   1. shared/server_profile.py::PROFILE_POLICY  -> prefer_local/allow_cloud/max_iterations
#   2. lilo_mcp.py::_PROFILE_TOOLS               -> conjunto de tools MCP expostas
#   3. config/mcp/<perfil>.json                  -> command + env do MCP server
#
# Este arquivo consolida 1 e 2 em um YAML pluggable lido por:
#   - shared/server_profile.get_profile_policy() -- merge com defaults
#   - lilo_mcp._build_profile_tools()            -- override do conjunto de tools
#
# Os JSONs em config/mcp/ continuam existindo (clients MCP precisam ler
# JSON), mas o env `LILO_SERVER_PROFILE` e o `--profile` resolvem agora
# pelas chaves deste YAML.
#
# Hot-reload: ambos os consumidores releem mtime a cada chamada (zero restart).
#
# Compatibilidade: se este arquivo nao existir, os defaults embarcados em
# shared/server_profile.py e lilo_mcp.py sao usados (zero quebra).

profiles:
  desktop_dev:
    policy:
      prefer_local: true
      allow_cloud: true
      max_iterations: 3
      description: "Maquina de desenvolvimento; local primeiro, nuvem liberada."
    mcp_tools: null  # null = todas as tools (sem filtro)

  pycharm_assistant:
    policy:
      prefer_local: true
