      - lilo_cost_recent
      - lilo_memory_search
      - lilo_memory_stats
      - lilo_memory_export
      - lilo_memory_cleanup
      - lilo_pull_model
      - lilo_list_local_models
      - fs_batch_read
      - fs_codemod
      - grep_and_read
      # V13/V14: revisao de literatura, redacao cientifica, documentos, EDA, meta
      - scholar_review
      - paper_draft
      - paper_section
      - paper_references
      - prism_eda
