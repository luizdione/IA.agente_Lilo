# config/profiles.yaml -- Registro UNIFICADO de perfis (V10, 2026-05-30)
# ====================================================================
# Antes desta versao, a mesma informacao de perfil estava espalhada em 3
# lugares:
#   1. shared/server_profile.py::PROFILE_POLICY  -> prefer_local/allow_cloud/max_iterations
#   2. lilo_mcp.py::_PROFILE_TOOLS               -> conjunto de tools MCP expostas
#   3. config/mcp/<perfil>.json                  -> command + env do MCP server
#
# Este arquivo consolida 1 e 2 em um YAML pluggable lido por:
#   - shared/server_profile.get_profile_policy() -- merge com defaults
#   - lilo_mcp._build_profile_tools()            -- override do conjunto de tools
#
# Os JSONs em config/mcp/ continuam existindo (clients MCP precisam ler
# JSON), mas o env `LILO_SERVER_PROFILE` e o `--profile` resolvem agora
# pelas chaves deste YAML.
#
# Hot-reload: ambos os consumidores releem mtime a cada chamada (zero restart).
#
# Compatibilidade: se este arquivo nao existir, os defaults embarcados em
# shared/server_profile.py e lilo_mcp.py sao usados (zero quebra).

profiles:
  desktop_dev:
    policy:
      prefer_local: true
      allow_cloud: true
      max_iterations: 3
      description: "Maquina de desenvolvimento; local primeiro, nuvem liberada."
    mcp_tools: null  # null = todas as tools (sem filtro)

  pycharm_assistant:
    policy:
      prefer_local: true
      allow_cloud: true
      max_iterations: 2
      description: "Assistente dentro do PyCharm; respostas rapidas, nuvem opcional."
    mcp_tools:
      - lilo_chat
      - lilo_sql
      - lilo_pdf
      - lilo_scholar
      - lilo_health
      - prism_analyze
      - prism_classify
      - prism_audit
      - villa_pipeline
      - villa_quick_ask
      - villa_explain_routing
      - fs_read
      - fs_write
      - fs_list
      - fs_stat
      - fs_search
      - run_shell
      - run_python
      - lilo_memory_set
      - lilo_memory_get
      - lilo_memory_list
      - lilo_memory_delete
      - lilo_cost_today
      - lilo_cost_recent
      - lilo_memory_search
      - lilo_memory_stats
      - lilo_memory_export
      - lilo_memory_cleanup
      - lilo_pull_model
      - lilo_list_local_models
      - fs_batch_read
      - fs_codemod
      - grep_and_read

  claude_desktop:
    policy:
      prefer_local: false
      allow_cloud: true
      max_iterations: 3
      description: "Claude Desktop (MCP/stdio); nuvem disponivel, qualidade primeiro."
    mcp_tools:  # equivale ao profile 'opus' (18 tools curadas)
      - lilo_web_search
      - lilo_web_fetch
      - fs_read
      - fs_write
      - fs_list
      - fs_stat
      - fs_search
      - run_python
      - run_shell
      - lilo_memory_set
      - lilo_memory_get
      - lilo_memory_list
      - lilo_memory_search
      - lilo_scholar
      - prism_analyze
      - prism_classify
      - lilo_list_local_models
      - lilo_pull_model
      - fs_batch_read
      - grep_and_read
      - fs_codemod

  cowork:
    policy:
      prefer_local: true
      allow_cloud: false
      max_iterations: 2
      description: "Automacao Cowork sem usuario; local-only para evitar custo."
    mcp_tools:  # mesmo set do profile 'bio' (sem run_shell/run_python)
      - lilo_chat
      - lilo_health
      - lilo_models
      - lilo_pdf
      - lilo_scholar
      - lilo_sql
      - prism_analyze
      - prism_classify
      - prism_audit
      - villa_pipeline
      - villa_quick_ask
      - villa_explain_routing
      - lilo_web_search
      - lilo_web_fetch
      - fs_read
      - fs_list
      - fs_stat
      - fs_search
      - lilo_memory_set
      - lilo_memory_get
      - lilo_memory_list
      - lilo_memory_search
      - lilo_memory_stats
      - lilo_memory_export
      - lilo_pull_model
      - lilo_list_local_models
      - lilo_cost_today
      - lilo_cost_recent
      - fs_batch_read
      - grep_and_read

  bio:
    policy:
      prefer_local: true
      allow_cloud: false
      max_iterations: 2
      description: "Perfil bio molecular; 100% local, sem run_shell, sem custo."
    mcp_tools:
      - lilo_chat
      - lilo_health
      - lilo_models
      - lilo_pdf
      - lilo_scholar
      - lilo_sql
      - prism_analyze
      - prism_classify
      - prism_audit
      - villa_pipeline
      - villa_quick_ask
      - villa_explain_routing
      - lilo_web_search
      - lilo_web_fetch
      - fs_read
      - fs_list
      - fs_stat
      - fs_search
      - lilo_memory_set
      - lilo_memory_get
      - lilo_memory_list
      - lilo_memory_search
      - lilo_memory_stats
      - lilo_memory_export
      - lilo_pull_model
      - lilo_list_local_models
      - lilo_cost_today
      - lilo_cost_recent
      - fs_batch_read
      - grep_and_read

  openclaw:
    policy:
      prefer_local: true
      allow_cloud: true
      max_iterations: 3
      description: "OpenClaw CLI (compat Claude Code); local primeiro, nuvem liberada."
    mcp_tools: null  # equivale ao profile 'desktop' (full)

  claude_code:
    policy:
      prefer_local: true
      allow_cloud: true
      max_iterations: 3
      description: "Claude Code CLI; complementar ao Read/Write/Bash nativos."
    mcp_tools:
      - villa_pipeline
      - villa_quick_ask
      - villa_explain_routing
      - prism_analyze
      - prism_classify
      - prism_audit
      - lilo_scholar
      - lilo_pdf
      - lilo_memory_set
      - lilo_memory_get
      - lilo_memory_list
      - lilo_memory_search
      - lilo_memory_stats
      - lilo_memory_export
      - lilo_memory_delete
      - lilo_memory_cleanup
      - lilo_cost_today
      - lilo_cost_recent
      - lilo_pull_model
      - lilo_list_local_models
      - lilo_health
      - lilo_models
      - villa_route  # V10: novo endpoint de roteamento puro

# Politica usada para perfis nao mapeados (conservadora).
fallback_policy:
  prefer_local: true
  allow_cloud: false
  max_iterations: 2
  description: "Perfil desconhecido; politica conservadora local-only."

# Aliases: nomes alternativos que apontam para outro perfil. Util pra
# manter compatibilidade com configs antigos enquanto migramos.
aliases:
  pycharm: pycharm_assistant
  desktop: desktop_dev
  opus: claude_desktop
