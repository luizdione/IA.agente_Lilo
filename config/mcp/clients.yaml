# config/mcp/clients.yaml — Servidores MCP EXTERNOS que o LILO consome
# ======================================================================
# V18.6 (E6): o LILO como CLIENTE MCP. Allow-list DUPLA e restritiva:
#   - so servidores listados aqui E com enabled: true sao alcançaveis;
#   - `tools` limita quais tools do servidor podem ser chamadas
#     (ausente/null = todas as tools do servidor).
# NADA e conectado ate uma chamada explicita via a tool `mcp_call`. As tools
# externas NAO sao injetadas no servidor MCP do LILO (sem explosao de
# superficie) — o acesso e sempre pela ponte mcp_call(server, tool, args).
#
# Exemplos (todos desligados por enabled: false — copie e ajuste):
servers:
  # filesystem:
