# Villa Lobos -- Domain Registry (V6, 2026-05-12)
# ================================================
# Mapeia dominio -> lista de palavras-chave usadas pelo router heuristico
# (_detect_domain) quando o LLM-router nao decide com confianca >= 0.55.
#
# Hot-reload: o agente le mtime deste arquivo a cada chamada e recarrega
# automaticamente se modificado (zero restart).
#
# Merge com defaults: dominios definidos aqui SOBRESCREVEM os defaults
# embarcados em agents/villa_lobos/agent.py:_DOMAIN_DEFAULTS. Dominios
# que existem so nos defaults sao preservados (nao removidos).
#
# Convenção de palavras-chave:
#   - tudo lowercase
#   - prefira substantivos/verbos especificos (alta precisao)
#   - evite palavras genericas ("dado", "info", "ajuda") -- baixa precisao
#   - aceita multi-palavras com espaco ("comparar grupos")

domains:
  prism:
    - prism
    - anova
    - t-test
    - kruskal
    - mann-whitney
    - shapiro
    - boxplot
    - p-valor
    - p-value
    - comparar grupos
    - experimento
    - pzfx
    - graphpad
    - normalidade
    # 2026-05-12: ampliacao p/ biologia molecular -- expressao gene/proteina
    - expressao genica
