services:
  # ── Ollama — Motor LLM local com GPU ──────────────────────────
  ollama:
    build:
      context: ./ollama-service
      dockerfile: Dockerfile
    container_name: lilo_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - lilo_network

  # ── ChromaDB — Memória vetorial ───────────────────────────────
  memory:
    build:
      context: ./memory
      dockerfile: Dockerfile
    container_name: lilo_memory
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lilo_network

  # ── Backend — FastAPI + subagentes ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lilo_backend
    volumes:
      - ./workspace:/workspace
      - ./backend/app:/app/app
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_HOST=memory
      - CHROMA_PORT=8001
      - WORKSPACE_DIR=/workspace
      - DEBUG=true
    depends_on:
      ollama:
        condition: service_healthy
      memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lilo_network

  # ── Dashboard — Streamlit (acesso direto aos agentes) ─────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: lilo_dashboard
    volumes:
      - .:/app
      - ollama_models:/root/.ollama
    ports:
      - "8506:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LITELLM_PROXY_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - lilo_network

  # ── Frontend — React (interface completa) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lilo_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lilo_network

volumes:
  ollama_models:
    driver: local
  chroma_data:
    driver: local
  backend_logs:
    driver: local

networks:
  lilo_network:
    driver: bridge
