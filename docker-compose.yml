# docker-compose.yml — Plataforma híbrida LILO unificada
# =========================================================
# V10.3 (2026-05-31): orquestra os 3 serviços da plataforma híbrida
# (proposta seção 6 do relatório 2026-05-30):
#   ollama   -> motor LLM local (modelos quentes)
#   litellm  -> proxy/gateway OpenAI-compat sobre Ollama + Anthropic
#   lilo_api -> FastAPI expondo o agente tipo Claude Desktop (lilo_api.py)
#
# Subir tudo:           docker compose up -d --build
# Logs do agente:       docker compose logs -f lilo_api
# Smoke da API:         curl http://localhost:8000/health
# Roteamento Villa:     curl 'http://localhost:8000/v1/villa/route?task=anova+exp1.xlsx'
# Capacidades:          curl http://localhost:8000/v1/villa/capabilities
#
# GPU: o serviço ollama declara reserva NVIDIA; em máquinas sem GPU,
# comente o bloco `deploy.resources` (Ollama roda em CPU).
#
# OLLAMA -- NATIVO (default) vs CONTAINERIZADO (opt-in)  [V15, 2026-06-21]
# ----------------------------------------------------------------------
# Se voce ja roda o Ollama NATIVO do Windows na porta 11434 (caso padrao
# desta maquina), NAO suba um segundo Ollama em container -- daria conflito de
# porta ("ports are not available ... 11434"). Por isso o servico `ollama`
# abaixo fica atras do profile `with-ollama` (NAO sobe por padrao); litellm e
# lilo_api falam com o Ollama do HOST via host.docker.internal:11434.
#   Default (usa Ollama nativo do host):   docker compose up -d --build
#   Maquina SEM Ollama nativo (sobe tudo): docker compose --profile with-ollama up -d --build

services:
  # ── Ollama — motor LLM local (OPT-IN; so em maquinas sem Ollama nativo) ────
  ollama:
    profiles: ["with-ollama"]   # nao sobe por padrao -> evita conflito na 11434
    build:
      context: ./ollama-service
      dockerfile: Dockerfile
    container_name: lilo_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - lilo_net
    restart: unless-stopped

  # ── LiteLLM — gateway OpenAI-compat (Ollama local + Anthropic nuvem) ───────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: lilo_litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config/litellm_config.docker.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Ollama do host por padrao; --profile with-ollama -> http://ollama:11434
      - OLLAMA_API_BASE=${LILO_DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
    # Sem depends_on de 'ollama' (default usa o Ollama NATIVO do host). O
    # api_base do litellm_config.docker.yaml aponta p/ host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lilo_net
    restart: unless-stopped

  # ── lilo_api — agente híbrido (FastAPI, "API rodando o agente Desktop") ────
  lilo_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lilo_api
    command: ["uvicorn", "lilo_api:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./:/app
      - lilo_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      # Default: Ollama NATIVO do host (host.docker.internal). Para usar o
      # Ollama containerizado, suba com --profile with-ollama E troque por
      # http://ollama:11434.
      - OLLAMA_HOST=${LILO_DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      - LITELLM_PROXY_URL=http://litellm:4000
      - LILO_SERVER_PROFILE=${LILO_SERVER_PROFILE:-desktop_dev}
      # DB de custos fora do bind-mount sincronizado (evita disk I/O error):
      - LILO_COST_DB=/app/logs/cost_tracking.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LILO_API_TOKEN=${LILO_API_TOKEN:-}
    depends_on:
      litellm:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lilo_net
    restart: unless-stopped

networks:
  lilo_net:
    driver: bridge

volumes:
  ollama_models:
  lilo_logs:
