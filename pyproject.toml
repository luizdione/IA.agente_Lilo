# pyproject.toml — LILO v13
# Pacote instalavel (`pip install -e .` cria o comando `lilo`) + config do pytest.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilo"
version = "13.2.0"
description = "Agente de terminal 100% local sobre Ollama (estilo Claude Code)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
lilo = "lilo.__main__:main"

[tool.setuptools]
packages = ["lilo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "requires_ollama: precisa do Ollama local (localhost:11434); pula se ausente",
    "requires_gpu: pesa na GPU (modelos grandes); pula sem backend ou com LILO_SKIP_GPU=1",
]
