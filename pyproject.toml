# pyproject.toml — LILO v14: so a configuracao do pytest.
# O repo deixou de ser pacote instalavel na F5 (13/10/2026): a v13 tinha `pip install -e .` e o
# comando `lilo`; hoje a operacao e o lilo.ps1 e a ponte sobe por scripts/lilo_host_serve.py no
# conda datascience (dependencias em requirements.txt).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
