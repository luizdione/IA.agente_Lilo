<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
  <title>LILO v7.0 — Arquitetura</title>
  <desc>Diagrama de arquitetura completa do LILO v7.0</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #1a1a2e; }
    .title { font-size: 16px; font-weight: 700; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .label { font-size: 11px; font-weight: 600; }
    .detail { font-size: 9.5px; fill: #64748b; }
    .box { rx: 6; fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; }
    .section { font-size: 10px; font-weight: 700; fill: #64748b; letter-spacing: 0.5px; }
    .check { font-size: 12px; fill: #22c55e; }
    .arrow { stroke: #94a3b8; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="350" y="28" text-anchor="middle" class="title">LILO v7.0 — Arquitetura</text>
  <text x="350" y="44" text-anchor="middle" class="subtitle">20/20 checks | 0 falhas | Policy Engine + 4 Subagentes + 3 MCP Servers</text>
  <text x="20" y="72" class="section">CORE</text>
  <rect x="20" y="80" width="200" height="80" class="box"/>
  <text x="30" y="97" class="label">shared/</text><text x="195" y="97" class="check">&#10003;</text>
  <text x="30" y="112" class="detail">policy.py — 35 indicadores + _normalize()</text>
  <text x="30" y="124" class="detail">llm_client.py — lazy detect, 1s timeout</text>
  <text x="30" y="136" class="detail">obsidian.py | cost_tracker.py | logger.py</text>
  <text x="30" y="148" class="detail">base_agent.py | utils.py</text>
  <rect x="20" y="168" width="200" height="42" class="box"/>
  <text x="30" y="186" class="label">lilo.py — Orquestrador</text><text x="195" y="186" class="check">&#10003;</text>
  <text x="30" y="200" class="detail">route() + health_check() + Obsidian log</text>
  <path d="M120 160 L120 168" class="arrow"/>
  <text x="240" y="72" class="section">SUBAGENTES</text>
  <rect x="240" y="80" width="200" height="80" class="box"/>
  <text x="250" y="97" class="label">4 Agentes</text><text x="415" y="97" class="check">&#10003;</text>
  <text x="250" y="112" class="detail">Analise_SQL — SQL + ANOVA/t-test</text>
  <text x="250" y="124" class="detail">PDFs_library — PyMuPDF multi-modo</text>
  <text x="250" y="136" class="detail">scholaragent — PubMed + arXiv + síntese</text>
  <text x="250" y="148" class="detail">llm-gateway — fallback multi-modo</text>
  <path d="M220 189 L240 140" class="arrow"/>
  <text x="460" y="72" class="section">POLICY ENGINE</text>
  <rect x="460" y="80" width="220" height="80" class="box"/>
  <text x="470" y="97" class="label">Roteamento Custo-Inteligente</text><text x="655" y="97" class="check">&#10003;</text>
  <text x="470" y="112" class="detail">NO_LLM → FAST → OLLAMA → HEAVY</text>
  <text x="470" y="124" class="detail">→ SONNET → OPUS</text>
  <text x="470" y="136" class="detail">Budget: $1.0/dia | _normalize() acentos</text>
  <text x="470" y="148" class="detail">35 indicadores bio + stats + DS</text>
  <text x="20" y="232" class="section">MCP SERVERS</text>
  <rect x="20" y="240" width="200" height="42" class="box"/>
  <text x="30" y="258" class="label">lilo_mcp.py — Claude Desktop</text><text x="195" y="258" class="check">&#10003;</text>
  <text x="30" y="272" class="detail">JSON-RPC stdio | 11 tools</text>
  <rect x="240" y="240" width="200" height="42" class="box"/>
  <text x="250" y="258" class="label">lilo_pycharm_mcp.py — PyCharm</text><text x="415" y="258" class="check">&#10003;</text>
  <text x="250" y="272" class="detail">FastMCP | 7 tools | auto-install mcp</text>
  <rect x="460" y="240" width="220" height="42" class="box"/>
  <text x="470" y="258" class="label">lilo_server.py — HTTP</text><text x="655" y="258" class="check">&#10003;</text>
  <text x="470" y="272" class="detail">StreamableHTTP :8899</text>
  <path d="M120 210 L120 240" class="arrow"/>
  <path d="M170 210 L340 240" class="arrow"/>
  <path d="M190 210 L570 240" class="arrow"/>
  <text x="20" y="308" class="section">INFRAESTRUTURA</text>
  <rect x="20" y="316" width="200" height="55" class="box"/>
  <text x="30" y="334" class="label">Dashboard Streamlit</text><text x="195" y="334" class="check">&#10003;</text>
  <text x="30" y="348" class="detail">6 abas: Chat SQL PDFs Scholar Custos Health</text>
  <text x="30" y="360" class="detail">Porta 8506 | start_dashboard.bat</text>
  <rect x="240" y="316" width="200" height="55" class="box"/>
  <text x="250" y="334" class="label">Docker Compose</text><text x="415" y="334" class="check">&#10003;</text>
  <text x="250" y="348" class="detail">5 serviços: ollama, chromadb, backend,</text>
  <text x="250" y="360" class="detail">dashboard, frontend | RUN_LILO.bat</text>
  <rect x="460" y="316" width="220" height="55" class="box"/>
  <text x="470" y="334" class="label">Villa Lobos (osquestrador)</text><text x="655" y="334" class="check">&#10003;</text>
  <text x="470" y="348" class="detail">5 agentes: Orch→Plan→Read→Work→Report</text>
  <text x="470" y="360" class="detail">mcp_server.py limpo | Obsidian vault</text>
</svg>
