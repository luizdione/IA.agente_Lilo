# V18 QW6: CI minimo — roda scripts/check.py (sintaxe + pyflakes + pytest)
# em maquina limpa a cada push/PR. A suite e offline por design (backend LLM
# mock; testes que exigem Ollama/GPU se auto-pulam via tests/conftest.py).
# Um CI assim teria pego meses atras o agents/paper fantasma (registrado no
# codigo mas nunca commitado — ver docs/tecnico/analise_open_agent_studio.md).
name: tests

on:
  push:
    branches: ["main", "arch-*", "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Instalar dependencias (subconjunto CI)
        run: pip install -r requirements-ci.txt
      - name: check.py (sintaxe + pyflakes + pytest)
        run: python scripts/check.py
