# LILO v14 - CI minimo: scripts/check.py (sintaxe + pyflakes + pytest da ponte lilo_host e dos
# filtros da interface) em maquina limpa a cada push/PR. Sem Ollama, GPU, Docker, R ou WSL: os
# testes que dependem deles pulam sozinhos (skipif/importorskip). O portao de latencia
# (lilo.ps1 bench) so roda na maquina do dono, com a GPU quieta.
name: tests

on:
  push:
    branches: ["main", "v14-*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Instalar dependencias (subconjunto CI)
        run: pip install -r requirements-ci.txt
      - name: check.py (sintaxe + pyflakes + pytest)
        run: python scripts/check.py
